name: Alpha desktop builds
# Manual workflow_dispatch build across macOS and Linux for alpha sharing.
# Uploads ad-hoc signed Mac DMGs, Linux AppImages, and headless runtime tarballs
# as workflow artifacts without requiring publisher signing keys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Alpha ${{ matrix.platform }} / ${{ matrix.arch }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native builds on the same OS baselines as release.yml.
        include:
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          version: 12.14.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: pnpm
      - name: Verify the native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'const assert = require("node:assert/strict"); assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH); console.info(process.platform, process.arch, process.versions.node)'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 squashfs-tools-ng gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Disable Spotlight indexing during macOS DMG creation
        if: runner.os == 'macOS'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo mdutil -a -i off || sudo mdutil -i off /System/Volumes/Data
      - name: Build the production app with a bounded heap
        env:
          RI_ROOT: ${{ runner.temp }}/ri-alpha-build-home
          RI_DB_PATH: ''
          RI_CONFIG_DIR: ''
          RI_WORK_DIR: ''
          NEXT_DIST_DIR: .next-desktop
          NODE_ENV: production
          RI_BUILD_MEMORY_LIMIT_GB: '16'
        run: node scripts/next-build.mjs
      - name: Build alpha installers
        env:
          RI_RELEASE_COMMIT: ${{ github.sha }}
        run: node desktop/package.mjs --share --skip-build
      - name: Verify expected alpha artifacts exist
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -- release/ri-runtime-*.tar.gz
          test -f "$1" || { echo "Missing headless runtime tarball"; exit 1; }
          if [ "$PLATFORM" = darwin ]; then
            set -- release/desktop/*.dmg
            test -f "$1" || { echo "Missing macOS DMG"; exit 1; }
          else
            set -- release/desktop/*.AppImage
            test -f "$1" || { echo "Missing Linux AppImage"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ri-alpha-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/desktop/*.dmg
            release/desktop/*.AppImage
            release/ri-runtime-*.tar.gz
