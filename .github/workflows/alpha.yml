name: Alpha desktop builds
# One manual, speech-free sharing path. Installer lifecycle checks are opt-in.
# Runs from main also replace the files on the rolling `alpha` pre-release (docs/alpha-builds.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native installer target
        type: choice
        options: [all, macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64]
        default: all
      installer_checks:
        description: Install and exercise actual installers on disposable hosted runners
        type: boolean
        default: false
      installer_run:
        description: Retest an existing alpha run without rebuilding (requires installer_checks)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          TARGET: ${{ inputs.target }}
          INSTALLER_RUN: ${{ inputs.installer_run }}
          INSTALLER_CHECKS: ${{ inputs.installer_checks }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const targets = [
            { target: 'macos-arm64', os: 'macos-15', platform: 'darwin', arch: 'arm64' },
            { target: 'macos-x64', os: 'macos-15-intel', platform: 'darwin', arch: 'x64' },
            { target: 'linux-x64', os: 'ubuntu-22.04', platform: 'linux', arch: 'x64' },
            { target: 'linux-arm64', os: 'ubuntu-22.04-arm', platform: 'linux', arch: 'arm64' },
            { target: 'windows-x64', os: 'windows-2025', platform: 'win32', arch: 'x64' },
          ];
          if (process.env.INSTALLER_RUN && process.env.INSTALLER_CHECKS !== 'true') throw new Error('Enable installer_checks when reusing installers');
          const include = targets.filter(t => process.env.TARGET === 'all' || t.target === process.env.TARGET);
          if (!include.length) throw new Error('Choose a supported target');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          JS
  build:
    needs: targets
    name: Alpha ${{ matrix.target }}
    timeout-minutes: ${{ inputs.installer_checks && 180 || 90 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.14.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
          cache: pnpm
      - name: Verify the native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'const a=require("node:assert/strict"); a.equal(process.platform,process.env.EXPECTED_PLATFORM); a.equal(process.arch,process.env.EXPECTED_ARCH)'
      - name: Install Linux native and desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth openbox libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 libnotify4 libxss1 libxtst6 xdg-utils libfuse2 squashfs-tools-ng gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Check types and native dependencies
        run: |
          pnpm ts
          node desktop/native-probe.mjs
      - name: Check desktop contracts
        if: runner.os != 'Windows'
        run: pnpm desktop:test
      - name: Check native Windows contracts
        if: runner.os == 'Windows'
        run: |
          pnpm exec vitest run --config desktop/vitest.config.ts desktop/windows-platform.test.ts desktop/package-layout.test.ts desktop/package-preflight.test.ts
          pnpm exec vitest run --config desktop/vitest.config.ts desktop/package-files.test.ts -t "Windows Next externals"
          pnpm exec vitest run src/lib/service/client.test.ts
      - name: Set up the Developer ID, when there is one
        id: apple
        if: runner.os == 'macOS' && !inputs.installer_run
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_NAME: ${{ vars.CSC_NAME }}
        run: bash desktop/mac-signing.sh setup
      - name: Disable Spotlight indexing during macOS DMG creation
        if: runner.os == 'macOS' && !inputs.installer_run
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo mdutil -a -i off || sudo mdutil -i off /System/Volumes/Data
      - name: Build the production app with a bounded heap
        if: ${{ !inputs.installer_run }}
        env:
          RI_ROOT: ${{ runner.temp }}/ri-alpha-build-home
          RI_DB_PATH: ''
          RI_CONFIG_DIR: ''
          RI_WORK_DIR: ''
          NEXT_DIST_DIR: .next-desktop
          NODE_ENV: production
          RI_BUILD_MEMORY_LIMIT_GB: '16'
        run: node scripts/next-build.mjs
      - name: Watch which processes use the DMG volume
        if: runner.os == 'macOS' && !inputs.installer_run
        # dmgbuild sometimes can't unmount its volume ("Resource busy"). Record each change in
        # who has files open on it, so the log can name what holds it.
        run: |
          (
            last=
            while sleep 2; do
              now=$(sudo -n lsof -n +f -- /Volumes/Ri* 2>/dev/null | awk 'NR > 1 { print $1 "(" $2 ")" }' | sort -u | tr '\n' ' ')
              if [ "$now" != "$last" ]; then echo "$(date -u +%T) ${now:-nothing open}"; last=$now; fi
            done
          ) > "$RUNNER_TEMP/dmg-volume.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dmg-volume.pid"
      - name: Build alpha installers
        if: ${{ !inputs.installer_run }}
        env:
          RI_RELEASE_COMMIT: ${{ github.sha }}
          UPGRADE_TEST: ${{ runner.os == 'Windows' && inputs.installer_checks && '--upgrade-test' || '' }}
          # A Developer ID signs and notarizes the Mac app. Empty, it is ad-hoc signed.
          CSC_NAME: ${{ steps.apple.outputs.identity }}
          CSC_KEYCHAIN: ${{ steps.apple.outputs.keychain }}
          APPLE_API_KEY: ${{ steps.apple.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ steps.apple.outputs.identity && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.identity && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: pnpm desktop:package --share --skip-build $UPGRADE_TEST
      - name: Check the signature, notarization and Gatekeeper
        if: runner.os == 'macOS' && !inputs.installer_run && steps.apple.outputs.identity != ''
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash desktop/mac-signing.sh verify release/desktop/mac*/Ri.app release/desktop/*.dmg
      - name: Remove the Developer ID from this runner
        if: always() && runner.os == 'macOS' && !inputs.installer_run
        run: bash desktop/mac-signing.sh cleanup
      - name: Record this build for the downloads list
        if: ${{ !inputs.installer_run }}
        shell: bash
        run: node desktop/release-downloads.mjs build --out release/build.json ${{ steps.apple.outputs.identity && '--notarized' || '' }}
      - name: Show which processes used the DMG volume
        if: always() && runner.os == 'macOS' && !inputs.installer_run
        run: |
          kill "$(cat "$RUNNER_TEMP/dmg-volume.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/dmg-volume.log" 2>/dev/null || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ inputs.installer_run }}
        with:
          name: ri-alpha-${{ matrix.platform }}-${{ matrix.arch }}
          path: release
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: runner.os == 'Windows' && inputs.installer_run
        with:
          name: ri-alpha-win32-x64-upgrade-fixture
          path: release/windows-upgrade-test
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
      - name: Verify expected alpha artifacts exist
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -- release/ri-runtime-*.tar.gz
          test -f "$1" || { echo "Missing headless runtime tarball"; exit 1; }
          case "$PLATFORM" in
            darwin) set -- release/desktop/*.dmg ;;
            win32) set -- release/desktop/Ri-Setup-*-x64.exe ;;
            linux)
              set -- release/desktop/*.deb
              test -f "$1" || { echo "Missing Linux Debian package"; exit 1; }
              set -- release/desktop/*.AppImage ;;
          esac
          test -f "$1" || { echo "Missing platform installer"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.installer_run }}
        with:
          name: ri-alpha-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/build.json
            release/desktop/*.dmg
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.exe
            release/ri-runtime-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows' && inputs.installer_checks && !inputs.installer_run
        with:
          name: ri-alpha-win32-x64-upgrade-fixture
          path: release/windows-upgrade-test/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Prepare the disposable Linux account's user service manager
        if: runner.os == 'Linux' && inputs.installer_checks
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          account_uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${account_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${account_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${account_uid}/bus" >> "$GITHUB_ENV"
      - name: Exercise Windows install, chat, quit, reopen, upgrade and uninstall
        if: runner.os == 'Windows' && inputs.installer_checks
        timeout-minutes: 45
        run: pnpm exec tsx desktop/windows-smoke.ts
      - name: Exercise macOS install and persistence
        if: runner.os == 'macOS' && inputs.installer_checks
        timeout-minutes: 45
        env:
          RI_SERVICE_SMOKE_SUPERVISOR: install-test-job-on-disposable-github-hosted-account
        run: pnpm exec tsx desktop/installer-smoke.ts
      - name: Exercise Linux install, persistence, AppImage and uninstall
        if: runner.os == 'Linux' && inputs.installer_checks
        timeout-minutes: 45
        env:
          RI_SERVICE_SMOKE_SUPERVISOR: install-test-job-on-disposable-github-hosted-account
        run: |
          xvfb-run --auto-servernum sh -ec '
            openbox --sm-disable >/dev/null 2>&1 &
            manager_pid=$!
            trap "kill $manager_pid 2>/dev/null || true" EXIT
            pnpm exec tsx desktop/installer-smoke.ts
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.installer_checks
        with:
          name: ri-alpha-${{ matrix.platform }}-${{ matrix.arch }}-qualification
          path: |
            release/qualification/*.json
            release/qualification/*.png
          if-no-files-found: ignore
          retention-days: 14
  publish:
    name: Publish the alpha release
    needs: build
    # Only main replaces the public downloads, with whichever platforms passed. Branch
    # runs and retests keep their artifacts only. The alpha tag never matches release.yml.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.installer_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency: alpha-release
    permissions:
      contents: write
      actions: read
      # Provenance attestations for this run's installers, and nothing else.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            desktop/alpha-release.mjs
            desktop/release-downloads.mjs
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ri-alpha-*
          path: ${{ runner.temp }}/alpha
      - name: Replace the passing platforms' installers on the alpha release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/alpha-release.mjs "$RUNNER_TEMP/alpha"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.publish.outputs.published == 'true'
        with:
          subject-checksums: ${{ steps.publish.outputs.subjects }}
      - name: Rebuild the website
        if: steps.publish.outputs.published == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK, so the website rebuilds on its own schedule."; exit 0; fi
          curl -fsS --retry 3 -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null || echo "::warning::The website's deploy hook failed. Its downloads update at its next deploy."
