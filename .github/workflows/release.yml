name: Publish a release
# docs/publishing.md. Pushing a tag like v0.2.0 publishes it to the latest channel.
# Promote it to stable, withdraw it, or refresh the feed's expiry by running this by hand.
# Nothing here publishes without the online signing key, which lives in the `release`
# environment and must be one the root-signed desktop/release-keys.json lists.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [promote, refresh, withdraw]
        default: promote
      version:
        description: The version, for promote or withdraw
        type: string
  schedule:
    # Release metadata expires after 30 days, so a frozen feed can't hold anyone back.
    - cron: '17 6 * * 1'

# Installing and building runs other people's packages, so only the jobs that upload can write.
permissions:
  contents: read

env:
  # The address written into every installation, for good. It only redirects, to
  # https://github.com/dynamismlabs/ri/releases/download/feed/, so the files can move
  # without moving anyone. Version files and installers stay on each version's release.
  RI_RELEASE_FEED: https://releases.ri.app/

jobs:
  # Before hours of building: publishing would refuse a signing key the keys file doesn't list.
  keys:
    if: github.event_name == 'push'
    name: Check the signing key
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - name: Check the signing key is listed in the keys file
        env:
          GH_TOKEN: ${{ github.token }}
          RI_RELEASE_PUBLIC_KEY: ${{ vars.RI_RELEASE_PUBLIC_KEY }}
          RI_RELEASE_SIGNING_KEY: ${{ secrets.RI_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p feed-now
          # The feed's keys file too, since publishing uses the newer of the two.
          if gh release view feed >/dev/null 2>&1; then gh release download feed --dir feed-now --pattern keys.json || true; fi
          node desktop/publish-release.mjs check --existing feed-now

  build:
    needs: keys
    if: github.event_name == 'push'
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 150
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      # Set once a Windows signing provider is chosen. See the optional step below.
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_CREDENTIALS != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          # Native modules run only on systems at least as new as the one that built them.
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          # The installer only: Windows has no feed entry and doesn't update itself yet.
          - { os: windows-2025, platform: win32, arch: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.14.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - name: Install Linux native window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # squashfs-tools-ng is how the release tool inspects an AppImage, and Node's headers need GCC 12.
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 squashfs-tools-ng gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # The root key's public half, which every installation pins.
      - name: Write the public key
        if: runner.os != 'Windows'
        env:
          RI_RELEASE_PUBLIC_KEY: ${{ vars.RI_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RI_RELEASE_PUBLIC_KEY" || { echo "Run pnpm release:keygen and add the root public key. See docs/publishing.md."; exit 1; }
          printf '%s\n' "$RI_RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/release-public.pem"
      - name: Set up the Developer ID, when there is one
        id: apple
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_NAME: ${{ vars.CSC_NAME }}
        run: bash desktop/mac-signing.sh setup
      - name: Disable Spotlight indexing during macOS DMG creation
        if: runner.os == 'macOS'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo mdutil -a -i off || sudo mdutil -i off /System/Volumes/Data
      - name: Build
        env:
          RI_BUILD_MEMORY_LIMIT_GB: '16'
          RI_RELEASE_COMMIT: ${{ github.sha }}
          RI_RELEASE_PUBLIC_KEY_FILE: ${{ runner.temp }}/release-public.pem
          # Empty without a Developer ID, which builds an ad-hoc signed Mac app.
          CSC_NAME: ${{ steps.apple.outputs.identity }}
          CSC_KEYCHAIN: ${{ steps.apple.outputs.keychain }}
          APPLE_API_KEY: ${{ steps.apple.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ steps.apple.outputs.identity && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.identity && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          case "$RUNNER_OS" in
            # The installer alpha builds: unsigned, and with no feed, since nothing on Windows reads one yet.
            Windows) RI_RELEASE_FEED= RI_RELEASE_PUBLIC_KEY_FILE= pnpm desktop:package --share ;;
            # With no Developer ID yet, a Mac gets an ad-hoc signed dmg, which can't update itself.
            macOS) if [ -n "$CSC_NAME" ]; then pnpm desktop:release; else pnpm desktop:dmg; fi ;;
            *) pnpm desktop:release ;;
          esac
      - name: Check this platform's installers exist
        run: |
          case "$RUNNER_OS" in
            macOS) set -- release/desktop/*.dmg ;;
            Windows) set -- release/desktop/Ri-Setup-*-x64.exe ;;
            # Both, as alpha builds them. The deb has no feed entry: its app doesn't
            # replace itself, while the runtime inside updates from the feed.
            Linux)
              set -- release/desktop/*.deb
              test -f "$1" || { echo "Missing the Debian package"; exit 1; }
              set -- release/desktop/*.AppImage ;;
          esac
          test -f "$1" || { echo "Missing this platform's installer"; exit 1; }
      - name: Check the signature, notarization and Gatekeeper
        if: runner.os == 'macOS' && steps.apple.outputs.identity != ''
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash desktop/mac-signing.sh verify release/desktop/mac*/Ri.app release/desktop/*.dmg
      - name: Remove the Developer ID from this runner
        if: always() && runner.os == 'macOS'
        run: bash desktop/mac-signing.sh cleanup
      # Optional, and not set up yet: Windows code signing. Until it is, Windows shows
      # "Windows protected your PC" on first run (docs/publishing.md, Known gaps). To set it
      # up, choose a provider, add its secrets with one named WINDOWS_SIGNING_CREDENTIALS,
      # and replace the error below with the provider's command, signing
      # release/desktop/Ri-Setup-*.exe in place. Signing here, before upload, keeps
      # SHA256SUMS and the attestations about the signed file. electron-builder can instead
      # sign during the build (win.azureSignOptions or win.signtoolOptions in
      # desktop/package.mjs), which also signs Ri.exe and the uninstaller inside.
      - name: Sign the Windows installer (optional)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        run: |
          echo "::error::WINDOWS_SIGNING_CREDENTIALS is set, but this step has no signing command yet. Add your provider's command to .github/workflows/release.yml (docs/publishing.md)."
          exit 1
      - name: Check the Windows signature
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem release/desktop/Ri-Setup-*.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.StatusMessage)" }
            Write-Output "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Describe this platform's release
        if: runner.os != 'Windows'
        run: |
          VERSION_NUMBER="$(node -p "require('./package.json').version")"
          SHELL_ARG=""
          for candidate in release/desktop/*.zip release/desktop/*.AppImage; do
            case "$candidate" in *\**) ;; *) SHELL_ARG="--shell $candidate" ;; esac
          done
          node desktop/release-metadata.mjs \
            --resources "release/ri-runtime-$VERSION_NUMBER-${{ matrix.platform }}-${{ matrix.arch }}" \
            --runtime "release/ri-runtime-$VERSION_NUMBER-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NUMBER/" \
            --out release/payloads $SHELL_ARG
          # electron-updater names its file by channel, and these share one folder per release.
          # An ad-hoc signed Mac build has none, since it can't update itself.
          for file in release/desktop/latest*.yml; do
            if [ -e "$file" ]; then mv "$file" "release/desktop/${{ matrix.arch }}${file##*latest}"; fi
          done
      - name: Record this build for the downloads list
        run: node desktop/release-downloads.mjs build --out release/build.json ${{ steps.apple.outputs.identity && '--notarized' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ri-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/build.json
            release/ri-runtime-*.tar.gz
            !release/ri-runtime-*-win32-*.tar.gz
            release/payloads/*.json
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.exe
            release/desktop/*.yml
            !release/desktop/builder-debug.yml
            release/desktop/*.blockmap

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The signing key can live in this environment alone, and it can wait for approval.
    environment: release
    # A weekly refresh overlapping a publish would put older feed files back.
    concurrency:
      group: release-feed
    permissions:
      contents: write
      # Provenance attestations for the files, and nothing else.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Gather the files and their checksums
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p payloads assets
          find artifacts -name '*.payload.json' -exec cp {} payloads/ \;
          find artifacts -type f \( -name 'ri-runtime-*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp {} assets/ \;
          # SHA256SUMS for every installer and runtime, and downloads.json, this version's
          # files for the website, which promoting copies to stable.
          node desktop/release-downloads.mjs version --artifacts artifacts --out assets \
            --version "$VERSION" --commit "$GITHUB_SHA" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --notes-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          RI_RELEASE_PUBLIC_KEY: ${{ vars.RI_RELEASE_PUBLIC_KEY }}
          RI_RELEASE_SIGNING_KEY: ${{ secrets.RI_RELEASE_SIGNING_KEY }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p feed-now feed-next
          gh release view feed >/dev/null 2>&1 || gh release create feed --title "Release feed" --notes "The signed files every installation checks, and the downloads list the website reads. Not a release to download." --latest=false
          # A feed with files must download, or publishing would lose its index and its check for a repeat.
          if [ "$(gh release view feed --json assets --jq '.assets | length')" -gt 0 ]; then gh release download feed --dir feed-now --pattern '*.json'; fi
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)"
          git log --no-merges --format='%s' ${PREVIOUS:+"$PREVIOUS"..HEAD} | grep -E '^(feat|fix)(\(|:)' > notes.txt || true
          node desktop/publish-release.mjs publish --payloads payloads --channel latest --existing feed-now --out feed-next --notes notes.txt --feed "$RI_RELEASE_FEED"
          node desktop/release-downloads.mjs channel --record assets/downloads.json --channel latest --out feed-next
          # The app shows notes.txt as what changed. The release page also says how to check a file.
          { cat notes.txt; printf '\nCheck a download against SHA256SUMS, or run `gh attestation verify <file> --repo %s` to see the build that made it.\n' "$GITHUB_REPOSITORY"; } > release-notes.md
          gh release create "v$VERSION" assets/* --title "Ri $VERSION" --notes-file release-notes.md --verify-tag
          # The keys first, so no computer meets a file signed by a key it hasn't been told about.
          gh release upload feed feed-next/keys.json --clobber
          gh release upload feed feed-next/* --clobber
      - name: Rebuild the website
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK, so the website rebuilds on its own schedule."; exit 0; fi
          curl -fsS --retry 3 -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null || echo "::warning::The website's deploy hook failed. Its downloads update at its next deploy."

  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # It signs with the same key as publishing, so it runs where that key is. After a
    # rotation, its refresh signs every file again with the new key.
    environment: release
    concurrency:
      group: release-feed
    permissions:
      contents: write
    env:
      ACTION: ${{ inputs.action || 'refresh' }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.5.0'
      - name: Sign and upload
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
          RI_RELEASE_PUBLIC_KEY: ${{ vars.RI_RELEASE_PUBLIC_KEY }}
          RI_RELEASE_SIGNING_KEY: ${{ secrets.RI_RELEASE_SIGNING_KEY }}
        run: |
          # Nothing published yet: nothing to refresh.
          gh release view feed >/dev/null 2>&1 || { echo "No feed yet."; exit 0; }
          mkdir -p feed-now feed-next record
          gh release download feed --dir feed-now --pattern '*.json'
          node desktop/publish-release.mjs "$ACTION" --existing feed-now --out feed-next ${VERSION:+--version "$VERSION"}
          # The website's downloads follow the feed: stable offers what was promoted, and a
          # withdrawn version leaves its channels with nothing until the next one.
          : > stale.txt
          case "$ACTION" in
            promote)
              gh release download "v$VERSION" --dir record --pattern downloads.json
              node desktop/release-downloads.mjs channel --record record/downloads.json --channel stable --out feed-next ;;
            withdraw)
              node desktop/release-downloads.mjs withdraw --existing feed-now --version "$VERSION" > stale.txt ;;
          esac
          # The keys first, so no computer meets a file signed by a key it hasn't been told about.
          gh release upload feed feed-next/keys.json --clobber
          gh release upload feed feed-next/* --clobber
          while read -r name; do gh release delete-asset feed "$name" --yes; done < stale.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the website
        if: steps.feed.outputs.changed == 'true' && env.ACTION != 'refresh'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK, so the website rebuilds on its own schedule."; exit 0; fi
          curl -fsS --retry 3 -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null || echo "::warning::The website's deploy hook failed. Its downloads update at its next deploy."
